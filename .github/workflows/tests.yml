name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false  # One old Python falling over should not hide the others.
      matrix:
        python: ["3.9", "3.10", "3.11", "3.12", "3.13", "3.14"]

    name: Python ${{ matrix.python }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}

      # ovotemplate itself needs nothing; the extra pulls in python-box for the
      # tests, and installing the project here also proves pyproject.toml builds.
      - name: Install the test dependencies
        run: python -m pip install --quiet ".[test]"

      - name: Run the test suite
        run: python -m unittest ovotemplate -v

      - name: Check for syntax warnings
        run: python -W error::SyntaxWarning -c "import ovotemplate"
