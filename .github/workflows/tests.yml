name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false  # One old Python falling over should not hide the others.
      matrix:
        python: ["3.9", "3.10", "3.11", "3.12", "3.13", "3.14"]

    name: Python ${{ matrix.python }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}

      # Nothing to install for the tests: ovotemplate imports nothing outside the
      # standard library and the suite brings its own fixtures.
      - name: Run the test suite
        run: python -m unittest ovotemplate -v

      # Not needed to run the tests, but it keeps pyproject.toml honest.
      - name: Check that the package builds
        run: python -m pip install --quiet .

      - name: Check for syntax warnings
        run: python -W error::SyntaxWarning -c "import ovotemplate"
