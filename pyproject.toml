[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "ovotemplate"
description = "A single-file templating engine: one metacharacter per construct, no dependencies."
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Michiel Overtoom", email = "motoom@xs4all.nl" }]
keywords = ["template", "templating", "template-engine", "text-processing"]
dynamic = ["version"]

classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Text Processing :: Markup :: HTML",
    "Topic :: Software Development :: Libraries :: Python Modules",
]

[project.urls]
Homepage = "https://github.com/motoom/ovotemplate"
Source = "https://github.com/motoom/ovotemplate"
Issues = "https://github.com/motoom/ovotemplate/issues"

[tool.setuptools]
py-modules = ["ovotemplate"]

[tool.setuptools.dynamic]
version = { attr = "ovotemplate.__version__" }
